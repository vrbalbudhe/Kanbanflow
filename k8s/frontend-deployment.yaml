apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: varun029/kbf_frontend:01
          ports:
            - containerPort: 5173
          env:
            - name: VITE_API_URL
              valueFrom:
                secretKeyRef:
                  name: frontend-secret
                  key: VITE_API_URL
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
